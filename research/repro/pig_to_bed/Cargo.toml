[package]
name = "pig_to_bed"
version = "0.1.0"
edition = "2024"
description = "The real PIC pig panel through the packed .bed route, and what 2 bits cost on imputed dosages."
publish = false

[dependencies]
ocs_rs = { path = "../../.." }
faer = { version = "=0.24.0", default-features = false, features = ["linalg", "std", "rayon"] }

# Same release profile as the crate (BENCHES.md).
[profile.release]
opt-level = 3
lto = "thin"

# Own workspace root: a reproduction step, not a member of the crate's workspace.
[workspace]
