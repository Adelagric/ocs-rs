name: wheels

# Tags publish; pull requests and manual runs build and test. Deliberately not on every
# push to master — five platform builds per commit would burn Actions minutes for
# nothing.
on:
  push:
    tags: ["v*"]
  pull_request:
    paths:
      - "bindings/python/**"
      - "tests/**"
      - "src/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/wheels.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  core-tests:
    name: Rust core tests (${{ matrix.rust }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        rust: ["1.85.0", "stable"]
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain
        run: rustup toolchain install ${{ matrix.rust }} --profile minimal
      - name: Test core
        run: cargo +${{ matrix.rust }} test --locked

  build:
    name: wheel (${{ matrix.platform.runner }} / ${{ matrix.platform.target }})
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          - { runner: ubuntu-latest, target: x86_64 }
          - { runner: ubuntu-latest, target: aarch64 }
          - { runner: macos-14, target: aarch64 }
          # Intel macOS is cross-compiled from Apple silicon: the macos-13 runners
          # that could build it natively have been retired, and a job requesting one
          # sits queued until it is cancelled.
          - { runner: macos-14, target: x86_64 }
          - { runner: windows-latest, target: x64 }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # The wheel is abi3-py39, so one wheel per platform covers every supported
      # interpreter — no per-version matrix needed.
      - name: Build wheel
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.platform.target }}
          args: --release --locked --out dist --manifest-path bindings/python/Cargo.toml
          manylinux: auto
      - uses: actions/upload-artifact@v4
        with:
          name: wheel-${{ matrix.platform.runner }}-${{ matrix.platform.target }}
          path: dist

  test-native:
    name: pytest (${{ matrix.platform.runner }} / Python ${{ matrix.python }})
    needs: build
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      fail-fast: false
      matrix:
        python: ["3.9", "3.x"]
        platform:
          - { runner: ubuntu-latest, target: x86_64 }
          - { runner: macos-14, target: aarch64 }
          - { runner: windows-latest, target: x64 }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/download-artifact@v4
        with:
          name: wheel-${{ matrix.platform.runner }}-${{ matrix.platform.target }}
          path: dist
      - name: Install the built native wheel and independent test reference
        run: |
          python -m pip install numpy scipy pytest
          python -c "import glob, subprocess, sys; wheels = glob.glob('dist/*.whl'); assert len(wheels) == 1, wheels; subprocess.check_call([sys.executable, '-m', 'pip', 'install', '--no-deps', wheels[0]])"
      - name: Test installed wheel
        run: python -m pytest bindings/python/tests -q
      - name: Run quickstart
        run: python bindings/python/examples/quickstart.py

  sdist:
    name: sdist
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build sdist
        uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist --manifest-path bindings/python/Cargo.toml
      - uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist

  publish:
    name: publish to PyPI
    # Only on a version tag. Authentication is PyPI Trusted Publishing (OIDC): the
    # job exchanges a short-lived GitHub identity token for a publishing token, so
    # there is no API token to store, rotate or leak. PyPI must have a trusted
    # publisher registered for this repository, workflow file and environment.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [core-tests, build, test-native, sdist]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write # mandatory for trusted publishing
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true
