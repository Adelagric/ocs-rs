[build-system]
requires = ["maturin>=1.9,<2.0"]
build-backend = "maturin"

[project]
name = "ocs-rs"
version = "0.1.0"
description = "Exact, matrix-free optimum contribution selection (OCS) at genomic scale"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Adel Kaleche" }]
keywords = ["optimum-contribution-selection", "genomic-selection", "breeding", "quantitative-genetics", "optimization"]
classifiers = [
    "Development Status :: 4 - Beta",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Rust",
    "Programming Language :: Python :: Implementation :: CPython",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Topic :: Scientific/Engineering :: Mathematics",
]
dependencies = ["numpy>=1.21"]

[project.urls]
Homepage = "https://github.com/Adelagric/ocs-rs"
Source = "https://github.com/Adelagric/ocs-rs"
Issues = "https://github.com/Adelagric/ocs-rs/issues"
"Paper (Zenodo)" = "https://doi.org/10.5281/zenodo.20746987"

[tool.maturin]
# Mixed layout: pure-Python wrapper in python/, native extension built from src/.
python-source = "python"
module-name = "ocs_rs._ocs_rs"
features = ["pyo3/extension-module"]
